name: UX/UI checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Full deterministic verification
        run: pnpm ui check --full
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Dependency audit
        if: always()
        run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: current-ui-report
          path: |
            .artifacts/ui/current/report.json
            .artifacts/ui/current/rendered.json
            .artifacts/ui/current/*.log
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: failed-ui-evidence
          path: |
            .artifacts/ui/current/images/
            .artifacts/ui/current/playwright/
            .artifacts/ui/failed/
          retention-days: 3
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Original-to-React correspondence (independent of React-baseline gate)
        run: pnpm ui check --fidelity --full --widths "390,1440"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: current-original-fidelity-report
          path: |
            .artifacts/ui/fidelity/report.json
            .artifacts/ui/fidelity/run.json
            .artifacts/ui/fidelity/progress.json
            .artifacts/ui/fidelity/*.log
            .artifacts/ui/model-correspondence.json
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: original-fidelity-evidence
          path: |
            .artifacts/ui/fidelity/*.png
            .artifacts/ui/fidelity/review.html
          retention-days: 3
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --no-banner
